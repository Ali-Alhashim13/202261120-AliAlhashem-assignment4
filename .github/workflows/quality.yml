name: Code Quality Checks

on:
  push:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript Type Check
      run: npm run lint

    - name: Build Check
      run: npm run build

    - name: Report Success
      if: success()
      run: echo "✅ All code quality checks passed!"
